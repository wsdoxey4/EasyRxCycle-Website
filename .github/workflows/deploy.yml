name: Deploy website to Cloudflare Pages

# Runs on GitHub's servers on every push to main (and can be run manually).
# Builds the Next.js static export and deploys it — plus the functions/ dir — to the
# existing Cloudflare Pages project. No local upload, so the broken-pipe issue can't happen.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history: app/sitemap.ts dates each page from its last commit

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (static export → out/)
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_GOOGLE_MAPS_KEY: ${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_KEY }}
          NEXT_PUBLIC_GA: ${{ secrets.NEXT_PUBLIC_GA }}
          NEXT_PUBLIC_GTM_ID: ${{ secrets.NEXT_PUBLIC_GTM_ID }}
          NEXT_PUBLIC_CLARITY_ID: ${{ secrets.NEXT_PUBLIC_CLARITY_ID }}
          NEXT_PUBLIC_STRIPE_PK: ${{ secrets.NEXT_PUBLIC_STRIPE_PK }}
          NEXT_PUBLIC_ANALYTICS: "true"
          NEXT_PUBLIC_INDEXABLE: ${{ secrets.NEXT_PUBLIC_INDEXABLE }}

      - name: Save the live sitemap (for the IndexNow diff)
        run: curl -sfL https://easyrxcycle.com/sitemap.xml -o /tmp/live-sitemap.xml || true

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy out --project-name=easyrxcycle-website --branch=main

      - name: Ping IndexNow with new/changed pages (never fails the deploy)
        continue-on-error: true
        run: node scripts/indexnow.mjs out/sitemap.xml /tmp/live-sitemap.xml
